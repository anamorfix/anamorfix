<style>
:root{
  --insight-black:#1a2b30; --system-white:#fffcfa; --anchor-green:#5f9c7b;
  --purple-axis:#a2a4d8; --datum-pink:#e8b9c4; --metric-blue:#9ecfd9;
  --vector-orange:#d97340; --signal-yellow:#e2c84d; --index-red:#ab264f;
  --measured-purple:#452b63;
  --fg-secondary:color-mix(in srgb,var(--insight-black) 70%,var(--system-white));
  --fg-tertiary:color-mix(in srgb,var(--insight-black) 50%,var(--system-white));
  --fg-muted:color-mix(in srgb,var(--insight-black) 35%,var(--system-white));
  --bg-subtle:color-mix(in srgb,var(--system-white) 92%,var(--insight-black));
  --ease-standard:cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#1a2b30;font-family:'Red Hat Display',system-ui,-apple-system,sans-serif;overflow:hidden;}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#1a2b30;}
#screen{transform-origin:center center;}
button{font-family:inherit;}
input{font-family:inherit;}

/* ported keyframes */
@keyframes pulseTap{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.07);opacity:1}}
@keyframes ripple{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-22px)}100%{transform:translateY(0)}}
@keyframes floaty2{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(20px) rotate(8deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes slowSpin{to{transform:rotate(360deg)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popIn{0%{transform:scale(.55) translateY(14px);opacity:0}62%{transform:scale(1.06) translateY(0)}100%{transform:scale(1);opacity:1}}
@keyframes riseIn{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes livePulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes shrinkBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes fadeOverlay{from{background:rgba(26,43,48,0)}to{background:rgba(26,43,48,0.2)}}
@keyframes btnPop{0%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes confettiFall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(640px) rotate(220deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;}}
.likert-seg:hover{background:var(--insight-black)!important;color:var(--system-white)!important;transform:translateY(-6px);}
</style>
</head>

  /* ---------- reveal ---------- */
  getReveal(){ const a=this.state.lastAnswer; if(!a) return null;

  /* ---------- QR (deterministic placeholder) ---------- */
  drawQR(canvas){ const ctx=canvas.getContext("2d"); const n=25, s=canvas.width/n;

    let seed=987654321; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
    for(let r=0;r<n;r++){ for(let c=0;c<n;c++){ const inF=(r<8&&c<8)||(r<8&&c>=n-8)||(r>=n-8&&c<8); if(inF) continue; if(rnd()>0.55) ctx.fillRect(c*s, r*s, s, s); }}

  /* ============================================================
     SCREEN MARKUP (reproduced from the original template)
     ============================================================ */
  render(){
    const v=this.renderVals(); let html="";
    if(v.isAttract) html=this.scAttract(v);
    else if(v.isConsent) html=this.scConsent(v);
    else if(v.isQuestion) html=this.scQuestion(v);
    else if(v.isVideo) html=this.scVideo(v);
    else if(v.isCapture) html=this.scCapture(v);
    else if(v.isReview) html=this.scReview(v);
    else if(v.isRecruit) html=this.scRecruit(v);
    else if(v.isThanks) html=this.scThanks(v);
    else if(v.isLock) html=this.scLock(v);
    else if(v.isAdmin) html=this.scAdmin(v);
    else if(v.isEditq) html=this.scEditor(v);
    if(v.idleWarn) html += this.scIdle(v);
    document.getElementById("screen").innerHTML=html;
    this.postRender(v);
  },

  postRender(v){
    const prev=this._lastScreen, cur=this.state.screen;
    this._lastScreen=cur; // update first so nested renders (from setState in side-effects) don't re-trigger
    if(prev==="capture" && cur!=="capture") this.stopCamera();
    if(v.isQuestion && v.isAsking && v.isSwipe){ const card=document.getElementById("swipeCard");
      if(card){ card.addEventListener("pointerdown",e=>this.onSwipeStart(e)); card.addEventListener("pointermove",e=>this.onSwipeMove(e)); card.addEventListener("pointerup",()=>this.onSwipeEnd()); card.addEventListener("pointercancel",()=>this.onSwipeEnd()); } }
    if(v.isQuestion && v.isRevealed && !this._countDone){ this._countDone=true; this.animateReveal(); }
    if(!(v.isQuestion && v.isRevealed)) this._countDone=false;
    if(prev!=="capture" && cur==="capture") this.startCamera();
    if(cur==="capture" && this.stream){ const vid=document.getElementById("camVideo"); if(vid && vid.srcObject!==this.stream){ vid.srcObject=this.stream; vid.play&&vid.play().catch(()=>{}); } }
    if(prev!=="recruit" && cur==="recruit"){ const c=document.getElementById("qr"); if(c) this.drawQR(c); }
  },

  },

  scIdle(v){ return `
  <div style="position:absolute;inset:0;background:rgba(13,21,24,.88);color:var(--system-white);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;">
    <div style="font-weight:900;font-size:64px;letter-spacing:-.03em;">still there?</div>
    <div style="font-size:24px;font-weight:300;opacity:.8;margin-top:16px;">resetting for the next person in ${v.warnLeft}s</div>
    <button onclick="App.stayActive()" style="margin-top:42px;font-family:inherit;cursor:pointer;background:var(--signal-yellow);color:var(--insight-black);border:none;font-weight:800;font-size:24px;padding:20px 56px;border-radius:999px;">i'm still here</button>
  </div>`; }
};

App.init();
</script>
</body>
</html>
