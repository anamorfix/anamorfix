<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pulse — interactive intercept kiosk (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --insight-black:#1a2b30; --system-white:#fffcfa; --anchor-green:#5f9c7b;
  --purple-axis:#a2a4d8; --datum-pink:#e8b9c4; --metric-blue:#9ecfd9;
  --vector-orange:#d97340; --signal-yellow:#e2c84d; --index-red:#ab264f;
  --measured-purple:#452b63;
  --fg-tertiary:color-mix(in srgb,var(--insight-black) 50%,var(--system-white));
  --fg-secondary:color-mix(in srgb,var(--insight-black) 70%,var(--system-white));
  --fg-muted:color-mix(in srgb,var(--insight-black) 35%,var(--system-white));
  --bg-subtle:color-mix(in srgb,var(--system-white) 92%,var(--insight-black));
  --font:'Red Hat Display',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#0d1518;font-family:var(--font);color:var(--insight-black);overflow:hidden;}
#root{position:fixed;inset:0;user-select:none;-webkit-user-select:none;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}

/* keyframes (ported from prototype) */
@keyframes pulseTap{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.07);opacity:1}}
@keyframes ripple{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes floaty2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(20px) rotate(8deg)}}
@keyframes slowSpin{to{transform:rotate(360deg)}}
@keyframes popIn{0%{transform:scale(.55) translateY(14px);opacity:0}62%{transform:scale(1.06) translateY(0)}100%{transform:scale(1);opacity:1}}
@keyframes riseIn{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes shrinkBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes confettiFall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(110vh) rotate(220deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shared bits */
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:lowercase;font-weight:600;}
.pill{border:none;border-radius:999px;font-weight:800;font-size:clamp(18px,2.4vw,24px);padding:18px 46px;}
.pill.dark{background:var(--insight-black);color:var(--system-white);}
.pill.ghost{background:transparent;border:3px solid var(--insight-black);color:var(--insight-black);}
.center{align-items:center;justify-content:center;text-align:center;}
.pad{padding:clamp(28px,6vw,72px);}
.demo-badge{position:absolute;top:14px;left:14px;z-index:60;background:rgba(226,200,77,.16);color:var(--signal-yellow);
  border:1px solid rgba(226,200,77,.4);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:5px 11px;border-radius:999px;font-family:var(--font);pointer-events:none;}
.staff-hot{position:absolute;bottom:0;left:0;width:90px;height:90px;z-index:60;background:transparent;border:none;}

/* reveal bars */
.bar-row{display:flex;align-items:center;gap:14px;margin:10px 0;}
.bar-label{width:34%;font-weight:700;font-size:clamp(15px,1.9vw,20px);text-align:right;}
.bar-track{flex:1;height:clamp(34px,4.6vw,52px);background:color-mix(in srgb,var(--insight-black) 8%,transparent);border-radius:8px;overflow:hidden;position:relative;}
.bar-fill{height:100%;transform-origin:left;animation:barGrow .6s cubic-bezier(.16,1,.3,1) both;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;border-radius:8px;}
.bar-pct{font-weight:900;font-size:clamp(15px,1.9vw,20px);color:var(--system-white);}
</style>
</head>

/* ---------- screen router ---------- */
function render(){
  stopCameraIfLeaving();
  root.innerHTML = (SCREENS[S.screen]||(()=> "<div class=screen></div>"))();
  postRender();
  manageIdle();
}
function go(screen){ S.screen=screen; render(); }

/* ---------- idle handling (participant flow only) ---------- */
const PARTICIPANT = new Set(["consent","question","video","capture","review","recruit"]);
function manageIdle(){
  clearTimeout(S.idle.timer); clearTimeout(S.idle.warnTimer);
  S.idle.warning=false;
  const ov=document.getElementById("idleOverlay"); if(ov) ov.remove();
  if(PARTICIPANT.has(S.screen)) armIdle();
}
function armIdle(){
  clearTimeout(S.idle.timer);
  S.idle.timer=setTimeout(showIdleWarn, S.IDLE_MS);
}
function bumpIdle(){ if(PARTICIPANT.has(S.screen) && !S.idle.warning) armIdle(); }
function showIdleWarn(){
  S.idle.warning=true; S.idle.countdown=Math.round(S.WARN_MS/1000);
  const div=document.createElement("div");
  div.id="idleOverlay";
  div.style.cssText="position:absolute;inset:0;z-index:80;background:rgba(13,21,24,.9);color:var(--system-white);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;";
  div.innerHTML=`<div style="font-weight:900;font-size:clamp(40px,7vw,64px);letter-spacing:-.03em;">still there?</div>
    <div style="font-size:clamp(18px,3vw,24px);font-weight:300;opacity:.8;margin-top:16px;">resetting for the next person in <b id="idleCount">${S.idle.countdown}</b>s</div>
    <button class="pill" style="margin-top:42px;background:var(--signal-yellow);color:var(--insight-black);" onclick="App.stayActive()">i'm still here</button>`;
  root.appendChild(div);
  S.idle.warnTimer=setInterval(()=>{
    S.idle.countdown--; const c=document.getElementById("idleCount"); if(c)c.textContent=S.idle.countdown;
    if(S.idle.countdown<=0){ clearInterval(S.idle.warnTimer); App.restart(); }
  },1000);
}

/* ---------- distribution helpers ---------- */
function optionsFor(q){
  if(q.type==="swipe") return [["left",q.swipe.left],["right",q.swipe.right]];
  return q.likert.map((lab,i)=>[String(i),lab]);
}
function totalFor(q){ return Object.values(q.dist||{}).reduce((a,b)=>a+(+b||0),0); }
function distBars(q){
  const opts=optionsFor(q), total=totalFor(q), show=total>=q.minN;
  return opts.map(([key,lab],i)=>{
    const n=(q.dist&&q.dist[key])||0;
    const pct= total? Math.round(n/total*100):0;
    const chosen = String(S.chosen)===String(key);
    const col=PALETTE[i%PALETTE.length];
    const fill = chosen? "var(--insight-black)" : col;
    return `<div class="bar-row">
      <div class="bar-label" style="${chosen?'color:var(--insight-black);font-weight:900;':''}">${esc(lab)}${chosen?' &larr;':''}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${show?Math.max(pct,4):4}%;background:${fill};animation-delay:${i*70}ms;">
        ${show?`<span class="bar-pct">${pct}%</span>`:''}</div></div>
      ${show?'':`<div style="width:60px;font-weight:800;font-size:14px;color:var(--fg-tertiary);">${n}</div>`}
    </div>`;
  }).join("");
}

  const num=`question ${S.qIndex+1} of ${S.config.questions.length}`;
  if(!S.revealed){
    if(q.type==="swipe"){
      return `<div class="screen" style="background:var(--system-white);">
        <div class="pad" style="padding-bottom:0;"><div class="eyebrow" style="color:var(--fg-tertiary);">${num}</div></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
          <div id="swipeCard" style="width:min(760px,86vw);background:var(--system-white);border:2px solid var(--insight-black);border-radius:24px;padding:clamp(36px,6vw,64px);text-align:center;touch-action:none;box-shadow:0 16px 48px rgba(26,43,48,.10);transition:transform .05s;">
            <div style="font-weight:900;font-size:clamp(32px,5vw,56px);line-height:1.05;letter-spacing:-.025em;">${esc(q.text)}</div>
            <div style="margin-top:26px;font-size:15px;color:var(--fg-tertiary);">swipe, or tap below</div>
          </div>
          <div style="display:flex;gap:20px;margin-top:38px;flex-wrap:wrap;justify-content:center;">
            <button class="pill ghost" style="min-width:200px;" onclick="App.answerSwipe('left')">${esc(q.swipe.left)}</button>
            <button class="pill dark" style="min-width:200px;" onclick="App.answerSwipe('right')">${esc(q.swipe.right)}</button>
          </div>
        </div></div>`;
    } else {
      const pts=q.likert.map((lab,i)=>`<button onclick="App.answerLikert(${i})" style="flex:1;min-width:110px;border:2px solid var(--insight-black);background:var(--system-white);color:var(--insight-black);border-radius:14px;padding:clamp(20px,3vw,34px) 10px;font-weight:800;font-size:clamp(15px,1.9vw,20px);display:flex;flex-direction:column;gap:10px;align-items:center;">
        <span style="font-size:clamp(22px,3vw,30px);font-weight:900;color:var(--fg-tertiary);">${i+1}</span>${esc(lab)}</button>`).join("");
      return `<div class="screen center pad" style="background:var(--system-white);">
        <div class="eyebrow" style="color:var(--fg-tertiary);">${num}</div>
        <div style="font-weight:900;font-size:clamp(32px,5vw,56px);line-height:1.05;letter-spacing:-.025em;margin-top:14px;max-width:20ch;">${esc(q.text)}</div>
        <div style="display:flex;gap:12px;margin-top:44px;width:min(900px,92vw);flex-wrap:wrap;">${pts}</div>
      </div>`;
    }
  }
  // revealed
  const total=totalFor(q), show=total>=q.minN;
  const last=S.qIndex>=S.config.questions.length-1;
  return `<div class="screen center pad" style="background:var(--system-white);">
    <div class="eyebrow" style="color:var(--fg-tertiary);">how others here have answered</div>
    <div style="font-weight:800;font-size:clamp(26px,4vw,42px);line-height:1.1;letter-spacing:-.02em;margin-top:10px;max-width:22ch;">${esc(q.text)}</div>
    <div style="width:min(760px,92vw);margin-top:30px;">${distBars(q)}</div>
    <div style="font-size:13px;color:var(--fg-tertiary);margin-top:14px;">${show? (total+" responses").trim() : "a few early responses &mdash; percentages appear once more people vote"}</div>
    <button class="pill dark" style="margin-top:34px;" onclick="App.nextFromReveal()">${last?"last one &rarr;":"next &rarr;"}</button>
  </div>`;
};

      <div style="font-weight:800;font-size:14px;color:var(--fg-tertiary);">point ${i+1}</div>
      <input value="${esc(lab)}" oninput="App.setScale(${i},this.value)" style="width:100%;font-size:16px;font-weight:600;padding:10px 12px;border:2px solid color-mix(in srgb,var(--insight-black) 30%,transparent);border-radius:9px;user-select:text;"></div>`).join("");
    typeBlock=`<div style="margin-top:18px;"><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
      <div class="eyebrow" style="color:var(--fg-tertiary);">scale points</div>
      <button onclick="App.scalePoint(-1)" style="width:36px;height:36px;border-radius:9px;border:2px solid var(--insight-black);background:#fff;font-size:20px;font-weight:700;">&minus;</button>
      <button onclick="App.scalePoint(1)" style="width:36px;height:36px;border-radius:9px;border:2px solid var(--insight-black);background:#fff;font-size:20px;font-weight:700;">+</button></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">${sp}</div></div>`;
  }
  return `<div class="screen" style="background:var(--bg-subtle);padding:clamp(20px,3vw,32px) clamp(24px,4vw,52px);overflow:auto;">
    <div style="display:flex;align-items:center;gap:16px;">
      <button onclick="App.cancelEdit()" style="background:none;border:none;color:var(--fg-secondary);font-size:16px;font-weight:600;">&larr; back</button>
      <div style="font-weight:800;font-size:clamp(20px,2.6vw,25px);letter-spacing:-.02em;">${S.editIndex>=0?"edit question":"new question"}</div>
      <span style="margin-left:auto;font-size:12px;font-weight:700;background:var(--insight-black);color:#fff;padding:5px 12px;border-radius:999px;">config v${S.config.version}</span></div>
    <div style="margin-top:20px;"><div class="eyebrow" style="color:var(--fg-tertiary);margin-bottom:8px;">question wording</div>
      <input value="${esc(q.text)}" oninput="App.setField('text',this.value)" style="width:100%;font-size:clamp(18px,2.4vw,23px);font-weight:600;padding:14px 18px;border:2px solid var(--insight-black);border-radius:10px;user-select:text;"></div>
    <div style="margin-top:18px;"><div class="eyebrow" style="color:var(--fg-tertiary);margin-bottom:8px;">interaction type</div>
      <div style="display:flex;gap:12px;"><button onclick="App.setType('swipe')" style="${tab(q.type==='swipe')}">binary swipe</button><button onclick="App.setType('likert')" style="${tab(q.type==='likert')}">likert / rating</button></div></div>
    ${typeBlock}
    <div style="margin-top:24px;display:flex;gap:40px;flex-wrap:wrap;align-items:center;">
      <div style="display:flex;align-items:center;gap:14px;"><button onclick="App.toggle('randomise')" style="${tg(q.randomise)}"><span style="${knob(q.randomise)}"></span></button>
        <div><div style="font-weight:700;font-size:16px;">randomise option order</div><div style="font-size:13px;color:var(--fg-tertiary);">logs the order shown per response</div></div></div>
      <div style="display:flex;align-items:center;gap:14px;"><button onclick="App.toggle('showDist')" style="${tg(q.showDist)}"><span style="${knob(q.showDist)}"></span></button>
        <div><div style="font-weight:700;font-size:16px;">show live distribution</div><div style="font-size:13px;color:var(--fg-tertiary);">the mentimeter-style reveal</div></div></div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div><div style="font-weight:700;font-size:16px;">min responses before %</div><div style="font-size:13px;color:var(--fg-tertiary);">small-n suppression</div></div>
        <div style="display:flex;align-items:center;gap:10px;"><button onclick="App.minN(-1)" style="width:40px;height:40px;border-radius:10px;border:2px solid var(--insight-black);background:#fff;font-size:22px;font-weight:700;">&minus;</button>
          <span style="font-weight:900;font-size:24px;min-width:30px;text-align:center;">${q.minN}</span>
          <button onclick="App.minN(1)" style="width:40px;height:40px;border-radius:10px;border:2px solid var(--insight-black);background:#fff;font-size:22px;font-weight:700;">+</button></div></div>
    </div>
    <div style="margin-top:30px;padding-top:20px;display:flex;gap:16px;">
      <button onclick="App.saveQuestion()" style="background:var(--insight-black);color:#fff;border:none;font-weight:800;font-size:20px;padding:15px 42px;border-radius:999px;">save question</button>
      <button onclick="App.cancelEdit()" style="background:none;border:2px solid var(--insight-black);color:var(--insight-black);font-weight:700;font-size:20px;padding:15px 34px;border-radius:999px;">cancel</button></div>
  </div>`;
};

/* ============================================================
   POST-RENDER (listeners that can't be inline)
   ============================================================ */
function postRender(){
  if(S.screen==="question" && !S.revealed){
    const q=S.config.questions[S.qIndex];
    if(q && q.type==="swipe") wireSwipe();
  }
  if(S.screen==="capture") startCamera();
  if(S.screen==="recruit") drawQR();
}

function wireSwipe(){
  const card=document.getElementById("swipeCard"); if(!card) return;
  let startX=0,drag=false,dx=0;
  card.addEventListener("pointerdown",e=>{drag=true;startX=e.clientX;dx=0;try{card.setPointerCapture(e.pointerId);}catch(_){}card.style.transition="none";});
  card.addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-startX;card.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`;
    card.style.borderColor = dx>60?"var(--anchor-green)":dx<-60?"var(--index-red)":"var(--insight-black)";});
  const end=()=>{if(!drag)return;drag=false;card.style.transition="transform .2s";
    if(dx>110){App.answerSwipe("right");} else if(dx<-110){App.answerSwipe("left");} else {card.style.transform="";card.style.borderColor="var(--insight-black)";} dx=0;};
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",end);
}

/* camera */
async function startCamera(){
  const v=document.getElementById("camPreview"), denied=document.getElementById("camDenied");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    S.capture.stream=stream; if(v){v.srcObject=stream;}
    if(denied)denied.style.display="none";
  }catch(e){
    S.capture.denied=true; if(v)v.style.display="none"; if(denied)denied.style.display="flex";
  }
}
function stopCameraIfLeaving(){
  if(S.screen!=="capture" && S.capture.stream){ S.capture.stream.getTracks().forEach(t=>t.stop()); S.capture.stream=null; }
}

/* QR placeholder (deterministic, non-scannable — real link is Megha's tracked URL) */
function drawQR(){
  const c=document.getElementById("qr"); if(!c)return; const ctx=c.getContext("2d"); const N=25, cell=240/N;
  ctx.fillStyle="#fffcfa";ctx.fillRect(0,0,240,240); ctx.fillStyle="#1a2b30";
  let seed=20260808; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(inFinder(x,y,N))continue; if(rnd()>0.52)ctx.fillRect(x*cell,y*cell,cell+0.5,cell+0.5); }
  finder(ctx,0,0,cell);finder(ctx,(N-7)*cell,0,cell);finder(ctx,0,(N-7)*cell,cell);
}
function inFinder(x,y,N){const f=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7;return f(0,0)||f(N-7,0)||f(0,N-7);}
function finder(ctx,px,py,cell){ctx.fillStyle="#1a2b30";ctx.fillRect(px,py,cell*7,cell*7);ctx.fillStyle="#fffcfa";ctx.fillRect(px+cell,py+cell,cell*5,cell*5);ctx.fillStyle="#1a2b30";ctx.fillRect(px+cell*2,py+cell*2,cell*3,cell*3);}

/* ============================================================
   APP (event handlers)
   ============================================================ */
const App = {
  go, openLock(){ S.pass="";S.passErr=false; go("lock"); },
  exitToKiosk(){ S.pass="";S.passErr=false; App.restart(); },

  startSession(){
    S.sessionId=uuid(); S.sessionStart=Date.now(); S.seqInSession=0; S.qIndex=0; S.revealed=false; S.chosen=null; S.videoConsented=false;
    S.metrics.sessions++; go("consent");
  },
  beginQuestions(){ S.qIndex=0; S.revealed=false; S.chosen=null; showQuestion(); },

  answerSwipe(side){ recordAnswer(side); },
  answerLikert(i){ recordAnswer(i); },

  nextFromReveal(){
    S.revealed=false; S.chosen=null; S.qIndex++;
    if(S.qIndex>=S.config.questions.length){ go("video"); } else { showQuestion(); }
  },

  startCapture(){ S.capture={recording:false,seconds:0,denied:false,stream:null,timer:null}; go("capture"); },
  toggleRecord(){
    if(!S.capture.recording){ startRec(); } else { stopRec(); }
  },
  finish(){ go("thanks"); startThanksTimer(); },

  startThanksTimer(){},
  restart(){
    clearTimeout(S.thanksTimer); clearTimeout(S.idle.timer); clearInterval(S.idle.warnTimer);
    S.revealed=false; S.chosen=null; S.qIndex=0; go("attract");
  },
  stayActive(){ const ov=document.getElementById("idleOverlay"); if(ov)ov.remove(); S.idle.warning=false; clearInterval(S.idle.warnTimer); armIdle(); },

  /* passcode */
  passKey(k){ if(S.pass.length<4){S.pass+=k;S.passErr=false;} if(S.pass.length===4){ if(S.pass===S.PASSCODE){S.pass="";go("admin");} else {S.passErr=true;S.pass="";render();return;} } render(); },
  passDel(){ S.pass=S.pass.slice(0,-1); render(); },

  /* admin */
  move(i,d){ const j=i+d; if(j<0||j>=S.config.questions.length)return; const a=S.config.questions; [a[i],a[j]]=[a[j],a[i]]; bumpVersion(); render(); },
  dup(i){ const q=S.config.questions[i]; const copy=JSON.parse(JSON.stringify(q)); copy.id=q.id+"_copy"+Math.floor(Math.random()*999); copy.dist={}; S.config.questions.splice(i+1,0,copy); bumpVersion(); render(); },
  del(i){ S.config.questions.splice(i,1); bumpVersion(); render(); },
  edit(i){ S.editIndex=i; S.editing=JSON.parse(JSON.stringify(S.config.questions[i])); go("editor"); },
  addQuestion(){ S.editIndex=-1; S.editing={id:"q_new"+Math.floor(Math.random()*9999),type:"swipe",text:"New question?",swipe:{left:"no",right:"yes"},likert:["1","2","3","4","5"],randomise:false,showDist:true,minN:5,dist:{}}; go("editor"); },
  exportCSV(){ doExport(); },

  /* editor */
  setField(f,v){ if(f==="text")S.editing.text=v; if(f==="swipeLeft")S.editing.swipe.left=v; if(f==="swipeRight")S.editing.swipe.right=v; },
  setScale(i,v){ S.editing.likert[i]=v; },
  setType(t){ S.editing.type=t; render(); },
  scalePoint(d){ const l=S.editing.likert; if(d>0&&l.length<7)l.push(String(l.length+1)); if(d<0&&l.length>2)l.pop(); render(); },
  toggle(f){ S.editing[f]=!S.editing[f]; render(); },
  minN(d){ S.editing.minN=Math.max(0,Math.min(50,S.editing.minN+d)); render(); },
  saveQuestion(){
    if(!S.editing.swipe)S.editing.swipe={left:"no",right:"yes"};
    if(S.editIndex>=0){ S.editing.dist=S.config.questions[S.editIndex].dist||{}; S.config.questions[S.editIndex]=S.editing; }
    else { S.editing.dist=S.editing.dist||{}; S.config.questions.push(S.editing); }
    bumpVersion(); S.editing=null; S.editIndex=-1; go("admin");
  },
  cancelEdit(){ S.editing=null; S.editIndex=-1; go("admin"); }
};
window.App=App;

/* ---------- internal flow helpers ---------- */
function showQuestion(){
  const q=S.config.questions[S.qIndex];
  S.revealed=false; S.chosen=null; S.qShownAt=Date.now();
  S.orderShown = q && q.randomise ? shuffledOrder(q) : naturalOrder(q);
  go("question");
}
function naturalOrder(q){ return optionsFor(q).map(o=>o[0]).join("|"); }
function shuffledOrder(q){ const a=optionsFor(q).map(o=>o[0]); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.join("|"); }

function recordAnswer(value){
  const q=S.config.questions[S.qIndex];
  S.chosen=value;
  q.dist=q.dist||{}; q.dist[value]=(q.dist[value]||0)+1;            // simulated live distribution
  const label = q.type==="swipe" ? (value==="left"?q.swipe.left:q.swipe.right) : q.likert[value];
  S.responsesAll.push({
    response_id:uuid(), session_id:S.sessionId, device_id:"kiosk-preview", config_version:S.config.version,
    question_id:q.id, question_type:q.type, response_value:value, response_label:label,
    option_order_shown:S.orderShown, time_to_answer_ms:Date.now()-S.qShownAt,
    sequence_index:++S.seqInSession, created_at:new Date().toISOString(), platform:"web-preview"
  });
  S.metrics.interactions++;
  if(q.showDist){ S.revealed=true; go("question"); }
  else { App.nextFromReveal(); }
}

/* recording (simulated capture for preview) */
function startRec(){
  S.capture.recording=true; S.capture.seconds=0;
  document.getElementById("recBtn").style.background="transparent";
  document.getElementById("recDot").style.cssText="width:26px;height:26px;border-radius:6px;background:var(--index-red);";
  document.getElementById("recRing").style.display="block";
  document.getElementById("recTag").style.display="flex"; document.getElementById("recIdle").style.display="none";
  document.getElementById("recHint").textContent="recording… tap to stop";
  const ring=document.getElementById("recRingFg"), CIRC=301.6, MAX=30;
  S.capture.timer=setInterval(()=>{
    S.capture.seconds++;
    const clk=document.getElementById("recClock"); if(clk)clk.textContent="rec 0:"+String(S.capture.seconds).padStart(2,"0");
    if(ring)ring.style.strokeDashoffset = CIRC*(1-S.capture.seconds/MAX);
    if(S.capture.seconds>=MAX) stopRec();
  },1000);
}
function stopRec(){
  clearInterval(S.capture.timer); S.capture.recording=false;
  if(!S.videoConsented){ S.videoConsented=true; S.metrics.videoConsents++; }
  go("review");
}

/* config version */
function bumpVersion(){ S.config.version++; }

/* export Decipher-shaped CSV */
function doExport(){
  const cols=["record","uuid","session_id","config_version","question_id","question_type","response_value","response_label","option_order_shown","qtime","sequence_index","created_at","platform"];
  const header="# "+("Engagement data from festival attendees who chose to participate at the Insightrix/SaskWatch booth. Directional and illustrative; not weighted or projectable to any population.");
  const lines=[header, cols.join(",")];
  S.responsesAll.forEach((r,i)=>{
    const row=[i+1,r.response_id,r.session_id,r.config_version,r.question_id,r.question_type,r.response_value,r.response_label,r.option_order_shown,(r.time_to_answer_ms/1000).toFixed(2),r.sequence_index,r.created_at,r.platform];
    lines.push(row.map(v=>{const s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(","));
  });
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="pulse_export_decipher.csv"; a.click(); URL.revokeObjectURL(url);
  const now=new Date(); S.metrics.lastExport=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); render();
}

/* reset idle on any interaction */
["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev,bumpIdle,{passive:true}));

/* thanks auto-restart */
const _go=go;
function startThanksTimer(){ clearTimeout(S.thanksTimer); S.thanksTimer=setTimeout(()=>{ if(S.screen==="thanks")App.restart(); }, S.THANKS_MS); }

/* boot */
render();
</script>
